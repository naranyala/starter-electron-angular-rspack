<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#0f0f0f">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.example.com; frame-ancestors 'none';">
    <title>Electron + Vanilla TS App with Rspack</title>
    <style>
:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #141414;
  --bg-tertiary: #1e1e1e;
  --text-primary: #ffffff;
  --text-secondary: #a0a0a0;
  --border-color: #2a2a2a;
  --card-bg: #161616;
  --card-hover: #1f1f1f;
  --card-border: #2a2a2a;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
  --shadow-hover: 0 20px 60px rgba(0, 0, 0, 0.7);
  --accent-color: #3b82f6;
  --accent-hover: #2563eb;
  --footer-bg: #141414;
  --sidebar-width: 220px;
  --sidebar-bg: #0d0d0d;
  --sidebar-border: #222222;
}

.App {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: var(--text-primary);
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  padding-left: var(--sidebar-width);
}

.App-main-no-navbar {
  padding: 32px 36px;
  max-width: 1200px;
  margin: 0 auto;
  flex: 1;
  width: 100%;
}

@media (max-width: 1024px) {
  .App-main-no-navbar {
    padding: 28px;
  }
}

@media (max-width: 768px) {
  .App-main-no-navbar {
    padding: 20px;
  }
}

.search-container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto 28px;
}

.search-input {
  width: 100%;
  padding: 14px 18px;
  font-size: 15px;
  border: 2px solid var(--border-color);
  border-radius: 12px;
  box-sizing: border-box;
  transition: all 0.3s ease;
  background-color: var(--bg-secondary);
  color: var(--text-primary);
  font-weight: 500;
}

.search-input:focus {
  outline: none;
  border-color: var(--accent-color);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
}

.search-input::placeholder {
  color: var(--text-secondary);
}

.view-switcher {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
  background: var(--bg-secondary);
  padding: 8px;
  border-radius: 14px;
  border: 2px solid var(--border-color);
  width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.view-switcher::-webkit-scrollbar {
  display: none;
}

.switcher-button {
  padding: 10px 16px;
  background: transparent;
  border: none;
  border-radius: 10px;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  flex-shrink: 0;
}

.switcher-button:hover {
  color: var(--text-primary);
  background: var(--bg-tertiary);
}

.switcher-button.active {
  background: var(--accent-color);
  color: #fff;
  font-weight: 600;
}

.cards-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

@media (max-width: 1200px) {
  .cards-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 768px) {
  .cards-list {
    grid-template-columns: 1fr;
  }
}

.simple-card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 18px;
  box-shadow: var(--shadow);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 2px solid var(--card-border);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 120px;
  text-align: left;
  gap: 8px;
}

.simple-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-hover);
  background: var(--card-hover);
  border-color: var(--accent-color);
}

.simple-card-title {
  font-size: 1.1em;
  margin: 0;
  color: var(--text-primary);
  font-weight: 700;
  line-height: 1.2;
}

.simple-card-desc {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.93em;
  line-height: 1.45;
}

.no-results {
  padding: 64px 32px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 1.2em;
  grid-column: 1 / -1;
}

.category-section {
  margin-bottom: 48px;
  grid-column: 1 / -1;
}

.category-title {
  font-size: 2.2em;
  margin: 0 0 28px 0;
  color: var(--text-primary);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.App-footer {
  background-color: var(--footer-bg);
  padding: 24px 36px;
  border-top: 2px solid var(--border-color);
  margin-top: auto;
  text-align: center;
}

.App-footer p {
  margin: 0;
  color: var(--text-secondary);
  font-size: 1em;
}

.App-footer code {
  background: var(--bg-tertiary);
  padding: 6px 10px;
  border-radius: 6px;
  font-family: 'SF Mono', Monaco, monospace;
  font-size: 0.9em;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  width: 100%;
  margin: 0;
  padding: 0;
  font-family: sans-serif;
  background: var(--bg-primary);
}

.winbox-sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: var(--sidebar-width);
  height: 100vh;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 999;
}

.winbox-sidebar-heading {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  margin: 0;
}

.winbox-sidebar-home {
  border: 1px solid var(--border-color);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.winbox-sidebar-home:hover {
  border-color: var(--accent-color);
  color: var(--accent-color);
}

.winbox-sidebar-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  padding-right: 4px;
}

.winbox-sidebar-item {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.winbox-sidebar-item.is-active {
  border-color: var(--accent-color);
  box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.3);
}

.winbox-sidebar-item.is-minimized {
  opacity: 0.7;
}

.winbox-sidebar-title {
  border: none;
  background: transparent;
  color: var(--text-primary);
  text-align: left;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
}

.winbox-sidebar-actions {
  display: flex;
  gap: 6px;
}

.winbox-sidebar-action {
  flex: 1;
  border: 1px solid var(--border-color);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  font-size: 11px;
  padding: 6px 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.winbox-sidebar-action:hover {
  color: var(--text-primary);
  border-color: var(--accent-color);
}
    </style>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div class="App">
      <aside class="winbox-sidebar">
        <h2 class="winbox-sidebar-heading">Windows</h2>
        <button class="winbox-sidebar-home" type="button">Home</button>
        <div class="winbox-sidebar-list"></div>
      </aside>
      <main class="App-main-no-navbar">
        <div class="search-container">
          <input
            type="text"
            class="search-input"
            placeholder="Search integrations..."
            value=""
          />
        </div>

        <div class="view-switcher">
          <!-- Tabs will be dynamically inserted here -->
        </div>

        <div class="cards-list">
          <!-- Cards will be dynamically inserted here -->
        </div>
      </main>
      <footer class="App-footer">
        <p>
          Get started by editing <code>src/renderer/app.ts</code> and save to reload.
        </p>
      </footer>
    </div>
  </body>
</html>
